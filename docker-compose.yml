version: '3.8'
services:
  blog-api:
    build: ./Go-Blog-Backend
    container_name: blog-backend
    restart: always
    environment:
      - password=${BLOG_PWD} # 从宿主机环境变量读取
    depends_on:
      - redis
      - mysql
    networks:
      - blog-net

  redis:
    image: redis:7-alpine
    container_name: blog-redis
    restart: always
    networks:
      - blog-net

  mysql:
    image: mysql:8.0 # 使用官方 MySQL 8.0 镜像
    container_name: blog-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: go_blog
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql # 数据持久化,防止重启后数据丢失
    networks:
      - blog-net

  caddy:
    image: caddy:2-alpine
    container_name: blog-caddy
    restart: always
    ports:
      - "443:443" # 如果 用了 Cloudflare，只开放 443 即可
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile    # 挂载配置文件
      - ./certs:/etc/caddy/certs            # 挂载证书
      - ./dist:/srv/dist                    # 挂载前端静态文件
    depends_on:
      - blog-api
    networks:
      - blog-net

# 声明挂载卷
volumes:
  mysql_data:

networks:
  blog-net:
    driver: bridge